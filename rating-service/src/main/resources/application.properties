server.port=${SERVER_PORT:8084}
spring.application.name=rating-service

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://${RATING_DB_HOST:127.0.0.1}:${RATING_DB_PORT:5432}/${RATING_DB_NAME:rating_db}
spring.datasource.username=${RATING_DB_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${RATING_DB_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
