server.port=${SERVER_PORT:8083}
spring.application.name=order-service

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://${ORDER_DB_HOST:127.0.0.1}:${ORDER_DB_PORT:5432}/${ORDER_DB_NAME:order_db}
spring.datasource.username=${ORDER_DB_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${ORDER_DB_PASSWORD:${DB_PASSWORD:postgres}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
