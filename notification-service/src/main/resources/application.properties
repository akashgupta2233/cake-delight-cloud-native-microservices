server.port=${SERVER_PORT:8085}
spring.application.name=notification-service

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://${NOTIFICATION_DB_HOST:127.0.0.1}:${NOTIFICATION_DB_PORT:5432}/${NOTIFICATION_DB_NAME:notification_db}
spring.datasource.username=${NOTIFICATION_DB_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD:${DB_PASSWORD:postgres}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
