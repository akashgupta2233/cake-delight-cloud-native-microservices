apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-db
  namespace: cake-delight
  labels:
    app.kubernetes.io/name: order-db
    app.kubernetes.io/part-of: cake-delight
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-db
        app.kubernetes.io/part-of: cake-delight
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: order_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: DB_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: order-db-pvc
