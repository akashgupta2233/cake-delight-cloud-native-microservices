apiVersion: v1
kind: Service
metadata:
  name: frontend-nodeport
  namespace: cake-delight
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: cake-delight
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081
