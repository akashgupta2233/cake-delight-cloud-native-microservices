apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cake-delight
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: cake-delight
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: cake-delight
    spec:
      enableServiceLinks: false
      containers:
        - name: frontend
          image: akashgupta2233/cake-delight-frontend:v1.0.1
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
