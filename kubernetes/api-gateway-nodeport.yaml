apiVersion: v1
kind: Service
metadata:
  name: api-gateway-nodeport
  namespace: cake-delight
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: cake-delight
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
