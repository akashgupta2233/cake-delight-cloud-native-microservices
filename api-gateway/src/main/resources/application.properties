server.port=${SERVER_PORT:8080}
spring.application.name=api-gateway
spring.main.allow-bean-definition-overriding=true

spring.cloud.gateway.server.webflux.routes[0].id=catalog-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://${CATALOG_SERVICE_HOST:127.0.0.1}:${CATALOG_SERVICE_PORT:8082}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/catalog/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[1].id=order-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://${ORDER_SERVICE_HOST:127.0.0.1}:${ORDER_SERVICE_PORT:8083}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[2].id=rating-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://${RATING_SERVICE_HOST:127.0.0.1}:${RATING_SERVICE_PORT:8084}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/ratings/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[3].id=notification-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://${NOTIFICATION_SERVICE_HOST:127.0.0.1}:${NOTIFICATION_SERVICE_PORT:8085}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=2

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
